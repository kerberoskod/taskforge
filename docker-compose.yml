version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskforge-postgres
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: taskforge-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskforge
      SPRING_DATASOURCE_USERNAME: taskforge
      SPRING_DATASOURCE_PASSWORD: taskforge
      JWT_SECRET: taskforge-jwt-secret-change-in-production
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: taskforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
