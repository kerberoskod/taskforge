spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${SPRING_DATASOURCE_USERNAME:taskforge}
    password: ${SPRING_DATASOURCE_PASSWORD:taskforge}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
