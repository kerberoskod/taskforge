server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${SPRING_DATASOURCE_USERNAME:taskforge}
    password: ${SPRING_DATASOURCE_PASSWORD:taskforge}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

jwt:
  secret: ${JWT_SECRET:taskforge-jwt-secret-change-in-production}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
